# Supabase gratis menjeda proyek yang tidak dipakai 7 hari. Ping ringan tiap 6 hari menjaganya tetap aktif.
name: Jaga Supabase tetap aktif
on:
  schedule:
    - cron: '17 3 */6 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          URL="https://tibwgpqwroilzfyggyuz.supabase.co/rest/v1/trips?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYndncHF3cm9pbHpmeWdneXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NzE5NjYsImV4cCI6MjEwOTA0Nzk2Nn0.QIGkI8VDYlvnWFfudVE4WQHrCR6DOyRPwH3LwKr6bAY"
          CODE=$(curl -sS --max-time 30 -o resp.txt -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL" || echo "000")
          echo "Status HTTP: $CODE"
          echo "Balasan: $(head -c 300 resp.txt)"
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            echo "Database aktif."
          elif grep -q '"code":"42501"' resp.txt; then
            echo "Database menjawab (tabel tidak boleh dibaca tanpa login), itu tetap dihitung aktif."
          else
            echo "Gagal: lihat balasan di atas."; exit 1
          fi
